<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Segoe UI, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect width="900" height="470" fill="#ffffff"/>

  <!-- ============ 修复前 ============ -->
  <rect x="16" y="56" width="424" height="392" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="36" y="88" font-size="17" font-weight="700" fill="#b91c1c">修复前 · 坏了</text>
  <text x="424" y="88" font-size="12" fill="#dc2626" text-anchor="end">Android 14 + HyperOS / MIUI</text>

  <g>
    <rect x="36" y="104" width="384" height="48" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
    <text x="52" y="124" font-size="13.5" fill="#111827">① 从屏幕边缘侧滑</text>
    <text x="52" y="141" font-size="11.5" fill="#6b7280">用户想返回上一层</text>
    <line x1="228" y1="152" x2="228" y2="164" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="36" y="166" width="384" height="48" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
    <text x="52" y="186" font-size="13.5" fill="#111827">② 桌面 GestureStubView 接管手势</text>
    <text x="52" y="203" font-size="11.5" fill="#6b7280">准备把事件转发给当前 App</text>
    <line x1="228" y1="214" x2="228" y2="226" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="36" y="228" width="384" height="48" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
    <text x="52" y="248" font-size="13.5" fill="#111827">③ 反射构造 BackMotionEvent</text>
    <text x="52" y="265" font-size="11.5" fill="#6b7280">硬编码了 Android 15 才有的 8 参数构造</text>
    <line x1="228" y1="276" x2="228" y2="288" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="36" y="290" width="384" height="48" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="52" y="310" font-size="13.5" fill="#b91c1c" font-weight="600">④ ✗ NoSuchMethodException</text>
    <text x="52" y="327" font-size="11.5" fill="#6b7280">Android 14 只有 7 参数版本 → 拿到 null</text>
    <line x1="228" y1="338" x2="228" y2="350" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="36" y="352" width="384" height="48" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="52" y="372" font-size="13.5" fill="#111827">⑤ App 收到 null 事件</text>
    <text x="52" y="389" font-size="11.5" fill="#6b7280">WindowOnBackInvokedDispatcher 中止返回</text>
  </g>
  <text x="36" y="428" font-size="14" font-weight="700" fill="#b91c1c">结果：侧滑毫无反应，只能按返回键</text>

  <!-- ============ 修复后 ============ -->
  <rect x="460" y="56" width="424" height="392" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="480" y="88" font-size="17" font-weight="700" fill="#15803d">修复后 · 正常</text>
  <text x="868" y="88" font-size="12" fill="#16a34a" text-anchor="end">装本模块并重启</text>

  <g>
    <rect x="480" y="104" width="384" height="48" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
    <text x="496" y="124" font-size="13.5" fill="#111827">① 从屏幕边缘侧滑</text>
    <text x="496" y="141" font-size="11.5" fill="#6b7280">用户想返回上一层</text>
    <line x1="672" y1="152" x2="672" y2="164" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="480" y="166" width="384" height="48" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
    <text x="496" y="186" font-size="13.5" fill="#111827">② 桌面 GestureStubView 接管手势</text>
    <text x="496" y="203" font-size="11.5" fill="#6b7280">准备把事件转发给当前 App</text>
    <line x1="672" y1="214" x2="672" y2="226" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="480" y="228" width="384" height="48" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
    <text x="496" y="248" font-size="13.5" fill="#111827">③ 本模块 hook getInstance</text>
    <text x="496" y="265" font-size="11.5" fill="#6b7280">枚举框架里真实存在的构造函数</text>
    <line x1="672" y1="276" x2="672" y2="288" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="480" y="290" width="384" height="48" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="496" y="310" font-size="13.5" fill="#15803d" font-weight="600">④ ✓ 用 7 参数构造成功</text>
    <text x="496" y="327" font-size="11.5" fill="#6b7280">拿到一个完整、可用的 BackMotionEvent</text>
    <line x1="672" y1="338" x2="672" y2="350" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="480" y="352" width="384" height="48" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="496" y="372" font-size="13.5" fill="#111827">⑤ App 收到正常事件</text>
    <text x="496" y="389" font-size="11.5" fill="#6b7280">返回流程走通</text>
  </g>
  <text x="480" y="428" font-size="14" font-weight="700" fill="#15803d">结果：侧滑返回恢复正常</text>
</svg>
